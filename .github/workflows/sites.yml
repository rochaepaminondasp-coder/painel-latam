name: Sites da Taboola
on:
  workflow_dispatch:
    inputs:
      dias: { description: "dias separados por vírgula", required: true }
permissions: { contents: write }
jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/sites-check.mjs
        env:
          DIAS: ${{ inputs.dias }}
          TABOOLA_CLIENT_ID: ${{ secrets.TABOOLA_CLIENT_ID }}
          TABOOLA_CLIENT_SECRET: ${{ secrets.TABOOLA_CLIENT_SECRET }}
          TABOOLA_ACCOUNT_ID: ${{ secrets.TABOOLA_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
