name: Cotações PTAX (consulta)
on: { workflow_dispatch: { inputs: { de: { required: true }, ate: { required: true } } } }
jobs:
  ptax:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for M in USD EUR; do
            DE=$(date -d "${{ inputs.de }}" +%m-%d-%Y); ATE=$(date -d "${{ inputs.ate }}" +%m-%d-%Y)
            curl -s "https://olinda.bcb.gov.br/olinda/service/PTAX/versao/v1/odata/CotacaoMoedaPeriodo(moeda=@moeda,dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@moeda='$M'&@dataInicial='$DE'&@dataFinalCotacao='$ATE'&\$format=json&\$select=cotacaoVenda,dataHoraCotacao,tipoBoletim" > $M.json
            node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1]));const by={};for(const v of j.value){if(v.tipoBoletim!=="Fechamento")continue;by[v.dataHoraCotacao.slice(0,10)]=v.cotacaoVenda}console.log("PTAX_"+process.argv[2]+" "+JSON.stringify(by))' $M.json $M
          done
