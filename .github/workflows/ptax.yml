name: Cotações (consulta)
on: { workflow_dispatch: { inputs: { de: { required: true }, ate: { required: true } } } }
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for M in USD EUR; do
            curl -sL "https://api.frankfurter.app/${{ inputs.de }}..${{ inputs.ate }}?from=$M&to=BRL" > $M.json
            head -c 200 $M.json; echo
            node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1]));const by={};for(const [d,v] of Object.entries(j.rates||{}))by[d]=v.BRL;console.log("FX_"+process.argv[2]+" "+JSON.stringify(by))' $M.json $M || true
          done
