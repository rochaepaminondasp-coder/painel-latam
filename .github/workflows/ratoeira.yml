name: Atualizar painel (MGID + Ratoeira)

# A cada 3 horas: busca o tráfego na API da MGID e as vendas na Ratoeira Ads e grava no painel (data.json).
# Para rodar na hora: Actions → "Atualizar painel (MGID + Ratoeira)" → Run workflow.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Quantos dias para trás atualizar"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: ratoeira-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tráfego da MGID
        id: mgid
        continue-on-error: true
        env:
          MGID_TOKEN: ${{ secrets.MGID_TOKEN }}
          MGID_CLIENT_ID: "996870"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: node scripts/mgid-sync.mjs
      - name: Vendas da Ratoeira
        if: always()
        env:
          RATOEIRA_MCP_URL: ${{ secrets.RATOEIRA_MCP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: node scripts/ratoeira-sync.mjs
      - name: Avisar se a MGID falhou
        if: steps.mgid.outcome == 'failure'
        run: |
          echo "::error::A parte da MGID falhou (veja o passo 'Tráfego da MGID'). As vendas da Ratoeira foram atualizadas normalmente."
          exit 1
