name: Atualizar painel (MGID + Taboola + Ratoeira)

# Mantém o painel quase em tempo real:
#  - modo "loop" (padrão): atualiza hoje e ontem a cada ~4 minutos por ~50 minutos e,
#    no fim, chama a próxima rodada sozinho. Só existe uma rodada "loop" por vez.
#  - modo "once": uma atualização só (é o que o painel usa no botão de atualizar).
# O agendamento abaixo é só uma reserva para religar a corrente se ela parar.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = mantém atualizando sozinho; once = uma vez só"
        required: false
        default: "loop"
      days:
        description: "Quantos dias antes de hoje atualizar (hoje sempre entra)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: painel-${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'once') && 'once' || 'loop' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Atualizar MGID + Taboola + Ratoeira
        env:
          MGID_TOKEN: ${{ secrets.MGID_TOKEN }}
          MGID_CLIENT_ID: "996870"
          TABOOLA_CLIENT_ID: ${{ secrets.TABOOLA_CLIENT_ID }}
          TABOOLA_CLIENT_SECRET: ${{ secrets.TABOOLA_CLIENT_SECRET }}
          TABOOLA_ACCOUNT_ID: ${{ secrets.TABOOLA_ACCOUNT_ID }}
          RATOEIRA_MCP_URL: ${{ secrets.RATOEIRA_MCP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'once') && 'once' || 'loop' }}
          DAYS_IN: ${{ inputs.days || '1' }}
        run: |
          rounds=1; [ "$MODE" = "loop" ] && rounds=12
          fails=0
          for i in $(seq 1 $rounds); do
            # uma vez por dia (06h de Brasília) revisa os últimos 4 dias, para pegar reembolsos atrasados
            D=$DAYS_IN; [ "$(date -u +%H)" = "09" ] && [ "$i" = "1" ] && D=4
            echo "::group::Rodada $i/$rounds · $(TZ=America/Fortaleza date +%H:%M) · dias=$D"
            # pega a versão mais nova dos robôs a cada rodada (correções valem na hora)
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- scripts || echo "::warning::não atualizei os scripts"
            DAYS=$D node scripts/mgid-sync.mjs || { echo "::warning::MGID falhou na rodada $i"; fails=$((fails+1)); }
            DAYS=$D node scripts/taboola-sync.mjs || { echo "::warning::Taboola falhou na rodada $i"; fails=$((fails+1)); }
            CK=0; [ $(( (i - 1) % 4 )) -eq 0 ] && CK=1   # checkouts a cada ~16 min (poupa o limite da Ratoeira)
            DAYS=$D CHECKOUTS=$CK node scripts/ratoeira-sync.mjs || { echo "::warning::Ratoeira falhou na rodada $i"; fails=$((fails+1)); }
            echo "::endgroup::"
            [ "$i" -lt "$rounds" ] && sleep 230
          done
          echo "Falhas: $fails"
      - name: Chamar a próxima rodada
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.mode != 'once') || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ratoeira.yml --ref main -f mode=loop -f days=1
