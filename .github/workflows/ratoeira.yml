name: Atualizar painel (MGID + Ratoeira)

# Quase em tempo real: a cada 5 minutos busca o tráfego (API da MGID) e as vendas (Ratoeira Ads)
# de HOJE e de ONTEM e grava no painel (data.json no galho "dados").
# Uma vez por dia (06:17 de Brasília) revisa os últimos 4 dias, para pegar reembolsos atrasados.
# Para rodar na hora: Actions → "Atualizar painel (MGID + Ratoeira)" → Run workflow.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Quantos dias antes de hoje atualizar (hoje sempre entra)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: ratoeira-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tráfego da MGID
        id: mgid
        continue-on-error: true
        env:
          MGID_TOKEN: ${{ secrets.MGID_TOKEN }}
          MGID_CLIENT_ID: "996870"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.schedule == '17 9 * * *' && '4' || github.event.inputs.days || '1' }}
        run: node scripts/mgid-sync.mjs
      - name: Vendas da Ratoeira
        if: always()
        env:
          RATOEIRA_MCP_URL: ${{ secrets.RATOEIRA_MCP_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.schedule == '17 9 * * *' && '4' || github.event.inputs.days || '1' }}
        run: node scripts/ratoeira-sync.mjs
      - name: Avisar se a MGID falhou
        if: steps.mgid.outcome == 'failure'
        run: |
          echo "::error::A parte da MGID falhou (veja o passo 'Tráfego da MGID'). As vendas da Ratoeira foram atualizadas normalmente."
          exit 1
